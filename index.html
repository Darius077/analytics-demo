<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Mini Project</title>

  <!-- Google Tag Manager (înlocuiește GTM-XXXXXXX cu ID-ul tău la Pasul 2) -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-N85D44F9');</script>
  <!-- End Google Tag Manager -->

  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    button { padding: 10px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    form { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; border: 1px solid #e5e7eb; padding: 20px; border-radius: 8px; }
    input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; }
    .status { margin-top: 10px; color: green; display: none; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N85D44F9"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <h1>Demo Tracking Page</h1>
  <p>Pagină de test pentru fluxul complet: GTM &rarr; GA4 &rarr; Looker Studio.</p>

  <hr />

  <!-- 1. Eveniment de Click (CTA) -->
  <section>
    <h3>1. Acțiune Button Click</h3>
    <button id="cta-button" type="button">Apasă pentru Demo CTA</button>
  </section>

  <!-- 2. Eveniment Formular -->
  <section>
    <h3>2. Formular de Contact / Lead</h3>
    <form id="lead-form">
      <label for="user-name">Nume:</label>
      <input type="text" id="user-name" required placeholder="Ion Popescu" />

      <label for="user-email">Email:</label>
      <input type="email" id="user-email" required placeholder="ion@exemplu.com" />

      <button type="submit">Trimite formularul</button>
      <p id="form-feedback" class="status">Formular trimis cu succes!</p>
    </form>
  </section>

  <script>
    window.dataLayer = window.dataLayer || [];

    // Tracking Button Click
    document.getElementById('cta-button').addEventListener('click', function() {
      window.dataLayer.push({
        event: 'custom_button_click',
        button_id: 'cta-button',
        button_text: this.innerText
      });
      alert('Event "custom_button_click" trimis în dataLayer!');
    });

    // Tracking Form Submit
    document.getElementById('lead-form').addEventListener('submit', function(e) {
      e.preventDefault();

      window.dataLayer.push({
        event: 'custom_form_submit',
        form_name: 'contact_demo',
        form_status: 'success'
      });

      document.getElementById('form-feedback').style.display = 'block';
    });
  </script>
</body>
</html>
